<!DOCTYPE html>
<html>
<head>
  <title>File Organizer</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #f8fafc;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .muted {
      color: #94a3b8;
      font-size: 12px;
    }
    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn.secondary {
      background: #334155;
    }
    .toggle {
      position: relative;
      width: 46px;
      height: 26px;
      background: #374151;
      border-radius: 999px;
      cursor: pointer;
      transition: background .2s ease;
    }
    .toggle.on { background: #16a34a; }
    .knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      transition: left .2s ease;
    }
    .toggle.on .knob { left: 23px; }
  </style>
</head>
<body>
  <h1>File Organizer</h1>
  <div class="card">
    <div class="row">
      <div>
        <div>Auto-organize downloads</div>
        <div class="muted" id="statusText">Loading…</div>
      </div>
      <div id="toggle" class="toggle"><div class="knob"></div></div>
    </div>
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:8px;">
      <div>
        <div>Rules</div>
        <div class="muted"><span id="ruleCount">0</span> extensions mapped</div>
      </div>
      <button class="btn" id="openOptions">Manage</button>
    </div>
    <button class="btn secondary" id="resetDefaults">Reset to defaults</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
